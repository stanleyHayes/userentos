name: Reusable — E2E

# Reusable workflow: Playwright end-to-end tests against real dev servers
# with a MongoDB service container.
# Called by ci.yml — not triggered directly.

on:
  workflow_call:

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Server env — points at the Mongo service container above.
      MONGO_URI: mongodb://localhost:27017/rentos_e2e
      JWT_SECRET: test-jwt-secret-for-ci-only
      PORT: '3002'
      NODE_ENV: development
      PAYMENTS_PROVIDER_MODE: simulated
      # Client env — Vite proxy already targets /api -> :3002 in dev mode.
      VITE_API_URL: /api
      VITE_SOCKET_URL: http://localhost:3002
      # Playwright will reuse the dev server we boot manually.
      PLAYWRIGHT_REUSE_SERVER: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: |
          npm ci
          npm ci --prefix apps/api
          npm ci --prefix apps/web
          # Mobile specs import the app's own modules (and run it on Expo web below).
          npm ci --prefix apps/mobile
          npm ci --prefix e2e

      - name: Sync shared types
        run: npm run sync-types

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Start dev servers (client + server)
        run: nohup npm run dev > dev.log 2>&1 &

      - name: Wait for client and server to be ready
        run: |
          # Vite may fall back to 5174 if 5173 is taken; check both.
          CLIENT_PORT=5173
          if ! npx --yes wait-on "http://localhost:$CLIENT_PORT" --timeout 30000 2>/dev/null; then
            CLIENT_PORT=5174
            npx --yes wait-on "http://localhost:$CLIENT_PORT" --timeout 30000 || true
          fi
          echo "CLIENT_PORT=$CLIENT_PORT" >> "$GITHUB_ENV"
          npx --yes wait-on "http://localhost:$CLIENT_PORT" http://localhost:3002/api/health --timeout 180000 || \
            (echo '--- dev.log ---' && cat dev.log && exit 1)

      - name: Run Playwright tests
        run: DEV_CLIENT_PORT=${CLIENT_PORT:-5173} npm test
        working-directory: e2e

      # Web UI specs with every API response mocked (playwright.web-mocked.config.ts):
      # a second Vite server whose proxy points at nothing.
      - name: Run mocked web specs
        if: success() || failure()
        run: |
          (cd ../apps/web && VITE_PROXY_TARGET=http://localhost:3999 nohup npx vite --port 5602 --strictPort > ../../vite-mocked.log 2>&1 &)
          npx --yes wait-on http://localhost:5602 --timeout 120000
          PLAYWRIGHT_BASE_URL=http://localhost:5602 npx playwright test -c playwright.web-mocked.config.ts
        working-directory: e2e

      # The mobile app's screens on Expo web, with mocked API responses (playwright.mobile.config.ts).
      - name: Run mobile specs on Expo web
        if: success() || failure()
        run: |
          (cd ../apps/mobile && CI=1 EXPO_PUBLIC_API_URL=http://localhost:3402 nohup npx expo start --web --port 8190 > ../../expo-web.log 2>&1 &)
          npx --yes wait-on http://localhost:8190 --timeout 240000
          MOBILE_WEB_URL=http://localhost:8190 npx playwright test -c playwright.mobile.config.ts
        working-directory: e2e

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

      - name: Upload dev server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-server-log
          path: |
            dev.log
            vite-mocked.log
            expo-web.log
          retention-days: 7
