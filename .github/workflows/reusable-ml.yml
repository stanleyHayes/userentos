name: Reusable — ML Service

# Reusable workflow: pricing ML service tests.
# Called by ci.yml — not triggered directly.

on:
  workflow_call:

jobs:
  ml-service:
    name: ML Service (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/ml-service/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
