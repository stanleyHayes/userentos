services:
  - type: web
    name: rentos-api
    runtime: docker
    plan: free
    repo: https://github.com/stanleyHayes/userentos.git
    branch: main
    rootDir: .
    dockerfilePath: ./Dockerfile
    # Every variable the server reads. `sync: false` = Render prompts for the
    # value at Blueprint setup and stores it as a secret; never paste secrets
    # into this file, it is committed. Keys mirror server/.env.production.
    envVars:
      # ─── Core ───
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3002
      # Must end in /rentos_production — the database name is part of the URI.
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # Comma-separated web origins allowed to call this API.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Public URL of the WEB APP, not this API — every emailed link is built
      # from it (invitations, password resets, notification buttons).
      - key: PUBLIC_BASE_URL
        sync: false

      # ─── Payments ───
      # Must be set in the Render dashboard ('live' for real collections).
      # Never hardcode 'simulated' here — in production the simulator fakes
      # every payment without moving money.
      - key: PAYMENTS_PROVIDER_MODE
        sync: false
      # MTN MoMo Collections. BASE_URL defaults to the sandbox host, so it must
      # be set for live. CALLBACK_URL is this service's public webhook:
      # https://<api-host>/api/payments/webhook/mtn_momo
      - key: MTN_MOMO_SUBSCRIPTION_KEY
        sync: false
      - key: MTN_MOMO_API_USER
        sync: false
      - key: MTN_MOMO_API_KEY
        sync: false
      - key: MTN_MOMO_BASE_URL
        sync: false
      - key: MTN_MOMO_TARGET_ENV
        value: mtnghana
      - key: MTN_MOMO_CALLBACK_URL
        sync: false
      # Telecel Cash — adapter is a structural stub; confirm endpoints first.
      - key: TELECEL_CLIENT_ID
        sync: false
      - key: TELECEL_CLIENT_SECRET
        sync: false
      - key: TELECEL_BASE_URL
        sync: false
      - key: TELECEL_WEBHOOK_SECRET
        sync: false
      # AirtelTigo Money — adapter is a structural stub; re-validate endpoints.
      - key: AIRTELTIGO_CLIENT_ID
        sync: false
      - key: AIRTELTIGO_CLIENT_SECRET
        sync: false
      - key: AIRTELTIGO_BASE_URL
        sync: false
      - key: AIRTELTIGO_WEBHOOK_SECRET
        sync: false
      # Bank transfer rail — the deposit account shown to tenants, plus the
      # HMAC secret the PSP signs webhooks with. Unset falls back to a
      # placeholder account number.
      - key: BANK_DEPOSIT_ACCOUNT
        sync: false
      - key: BANK_DEPOSIT_BANK_NAME
        sync: false
      - key: BANK_PSP_WEBHOOK_SECRET
        sync: false

      # ─── Payouts (money out) ───
      # Which PSP sends payouts. Point the Paystack webhook at
      # https://<api-host>/api/webhooks/payouts/paystack — signatures are
      # verified with the secret key, so there is no separate webhook secret.
      - key: PAYOUT_PROVIDER
        value: paystack
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_BASE_URL
        sync: false

      # ─── Email / SMS ───
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      # No code path sends SMS today — set only when that lands.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

      # ─── Media / push ───
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

      # ─── AI / ML ───
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional override — defaults to claude-sonnet-4-20250514.
      - key: ANTHROPIC_MODEL
        sync: false
      # Only used for legal-document search embeddings.
      - key: OPENAI_API_KEY
        sync: false
      # External ML pricing service; unset falls back to the local model.
      - key: ML_SERVICE_URL
        sync: false
      # Shared secret with the ML pricing service — set in the dashboard.
      - key: ML_API_KEY
        sync: false

      # ─── Lending (defaults shown) ───
      - key: LOAN_INTEREST_RATE
        value: 15
      - key: LOAN_MIN_CREDIT_SCORE
        value: 50

      # ─── Infrastructure ───
      - key: REDIS_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_RELEASE
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: ENABLE_API_DOCS
        value: "false"

      # ─── Seeding ───
      # Blocks the demo seed from ever running against the live database.
      - key: SEED_DEMO
        value: "false"
      # Owner super-admin for `npm run seed:production`.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_FIRST_NAME
        sync: false
      - key: SEED_ADMIN_LAST_NAME
        sync: false
      - key: SEED_ADMIN_PHONE
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
