<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>Houses and apartments for rent and sale in Ghana | RentOS</title>
    <meta name="description" content="Find verified houses, apartments, rooms and short stays to rent or buy in Accra, Kumasi, Tema and across Ghana. Message agents safely and sign your tenancy online." />
    <meta name="keywords" content="houses for rent in Ghana, apartments for rent in Accra, property for sale Ghana, short stay Accra, real estate agents Ghana, tenancy agreement, rent advance, Rent Act" />
    <meta name="author" content="RentOS Ghana" />
    <meta name="theme-color" content="#1e3a5f" />

    <!-- Connect early to where pages get their data and photos. -->
    <link rel="preconnect" href="https://api.userentos.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="Houses and apartments for rent and sale in Ghana | RentOS" />
    <meta property="og:description" content="Find verified houses, apartments, rooms and short stays to rent or buy in Accra, Kumasi, Tema and across Ghana. Message agents safely and sign your tenancy online." />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="RentOS Ghana" />
    <meta property="og:locale" content="en_GH" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="__SITE_URL__/" />
    <meta name="twitter:title" content="Houses and apartments for rent and sale in Ghana | RentOS" />
    <meta name="twitter:description" content="Find verified houses, apartments, rooms and short stays to rent or buy in Accra, Kumasi, Tema and across Ghana. Message agents safely and sign your tenancy online." />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />

    <!-- WhatsApp / General -->
    <meta itemprop="name" content="RentOS Ghana" />
    <meta itemprop="description" content="Find verified houses, apartments and short stays to rent or buy across Ghana, and keep your tenancy on record." />
    <meta itemprop="image" content="__SITE_URL__/og-image.png" />

    <!-- No canonical link here: this shell answers every route, and naming the
         home page told search engines every page was a copy of it. Each page
         gets its own from api/page.ts (before JavaScript) and lib/seo.ts. -->

    <!-- Crawling -->
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Installable / mobile -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="RentOS" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Explicit image type and alt text: several crawlers skip an og:image
         without a declared MIME type, and alt text is what assistive tech reads
         out on a shared card. -->
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="RentOS Ghana — digital rental housing for Ghana" />
    <meta name="twitter:image:alt" content="RentOS Ghana — digital rental housing for Ghana" />

    <!-- Structured data: lets search engines show the site name and a search box
         rather than guessing both from the page title. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "__SITE_URL__/#organization",
            "name": "RentOS Ghana",
            "url": "__SITE_URL__/",
            "logo": "__SITE_URL__/og-image.png",
            "description": "Houses and apartments to rent and buy across Ghana, from verified agents and landlords.",
            "areaServed": { "@type": "Country", "name": "Ghana" }
          },
          {
            "@type": "WebSite",
            "@id": "__SITE_URL__/#website",
            "url": "__SITE_URL__/",
            "name": "RentOS Ghana",
            "alternateName": ["RentOS", "userentos"],
            "publisher": { "@id": "__SITE_URL__/#organization" },
            "inLanguage": "en-GH",
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "__SITE_URL__/registry?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
